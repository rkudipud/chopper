# Mirrors `make ci`: lint, format, types, import contracts, doc gates, full test suite at 100% coverage.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # cloc (vendored Perl) backs the SLOC accounting tests; ubuntu-latest ships perl.
      - run: perl -v
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,rich]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/
      - run: lint-imports --config pyproject.toml
      - run: python schemas/scripts/check_diagnostic_registry.py
      - run: python schemas/scripts/check_service_signatures.py
      - run: pytest tests/unit/ tests/integration/ tests/golden/ tests/property/ -q --cov-fail-under=100
